<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV 直播源管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; }
.app { max-width: 1400px; margin: 0 auto; padding: 24px; }
.header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.logo { width: 48px; height: 48px; background: #2563eb; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
.header h1 { font-size: 24px; font-weight: 600; }
.header p { font-size: 14px; color: #64748b; }
.tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 0; }
.tab { padding: 12px 20px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: 500; color: #64748b; transition: all 0.2s; }
.tab:hover { color: #2563eb; background: #f8fafc; }
.tab.active { color: #2563eb; background: white; border: 1px solid #e2e8f0; border-bottom-color: white; margin-bottom: -1px; }
.card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; margin-bottom: 16px; }
.card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #0f172a; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; }
.stat-card .label { font-size: 14px; color: #64748b; margin-bottom: 8px; }
.stat-card .value { font-size: 24px; font-weight: 700; color: #0f172a; }
.stat-card .sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
.btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
.btn-secondary:hover { background: #e2e8f0; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f1f5f9; }
.table th { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
.table tr:hover { background: #f8fafc; }
.badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.badge-success { background: #dcfce7; color: #16a34a; }
.badge-warning { background: #fef3c7; color: #d97706; }
.badge-info { background: #dbeafe; color: #2563eb; }
.progress { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-bar { height: 100%; background: #2563eb; transition: width 0.3s; }
textarea { width: 100%; min-height: 400px; font-family: monospace; font-size: 13px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; resize: vertical; }
.search { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 8px; width: 300px; margin-bottom: 16px; }
.search:focus { outline: none; border-color: #2563eb; }
.hidden { display: none; }
.loading { padding: 40px; color: #94a3b8; }
pre#log-preview { font-size: 12px; line-height: 1.6; padding: 12px; background: #f8fafc; border-radius: 8px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; text-align: left; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">📺</div>
    <div>
      <h1>IPTV 直播源管理</h1>
      <p>自动聚合 · 质量检测 · 运营商分类</p>
    </div>
  </div>
  
  <div class="tabs">
    <div class="tab active" onclick="showTab('overview')">概览</div>
    <div class="tab" onclick="showTab('channels')">频道数据</div>
    <div class="tab" onclick="showTab('config')">配置</div>
    <div class="tab" onclick="showTab('output')">输出文件</div>
  </div>
  
  <div id="overview" class="tab-content">
    <div class="stats">
      <div class="stat-card">
        <div class="label">频道数量</div>
        <div class="value" id="ch-count">--</div>
        <div class="sub">唯一频道</div>
      </div>
      <div class="stat-card">
        <div class="label">线路总数</div>
        <div class="value" id="url-count">--</div>
        <div class="sub">有效 URL</div>
      </div>
      <div class="stat-card">
        <div class="label">输出文件</div>
        <div class="value" id="file-count">--</div>
        <div class="sub">m3u/txt 文件</div>
      </div>
      <div class="stat-card">
        <div class="label">最后更新</div>
        <div class="value" id="last-update">--</div>
        <div class="sub">时间</div>
      </div>
    </div>
    
    <div class="card">
      <h3>运行控制</h3>
      <button class="btn btn-primary" onclick="runIPTV()">▶ 启动任务</button>
      <div id="progress-area" class="hidden" style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span id="phase-text" style="font-size: 14px; color: #64748b;">初始化中...</span>
          <span id="percent-text" style="font-size: 14px; font-weight: 600; color: #2563eb;">0%</span>
        </div>
        <div class="progress">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h3>实时日志</h3>
      <pre id="log-preview" class="loading">等待任务启动...</pre>
    </div>
  </div>
  
  <div id="channels" class="tab-content hidden">
    <div class="card">
      <h3>频道数据</h3>
      <input type="text" class="search" placeholder="搜索频道..." onkeyup="filterChannels(this.value)">
      <div id="channel-list"></div>
    </div>
  </div>
  
  <div id="config" class="tab-content hidden">
    <div class="card">
      <h3>配置文件 (config.py)</h3>
      <textarea id="config-editor"></textarea>
      <div style="margin-top: 16px;">
        <button class="btn btn-primary" onclick="saveConfig()">💾 保存配置</button>
        <button class="btn btn-secondary" onclick="loadConfig()">🔄 刷新</button>
      </div>
    </div>
  </div>
  
  <div id="output" class="tab-content hidden">
    <div class="card">
      <h3>输出文件</h3>
      <table class="table">
        <thead><tr><th>文件名</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead>
        <tbody id="output-tbody"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="channel_data.js">


let selectedDays = [];
let selectedTimes = [];
let customTimes = [];

async function openScheduleDialog() {
  const res = await fetch('/api/schedule');
  const data = await res.json();
  selectedDays = data.days || [];
  selectedTimes = data.times || [];
  customTimes = [];
  document.querySelectorAll('.day-btn').forEach(btn => {
    const day = parseInt(btn.dataset.day);
    btn.classList.toggle('btn-primary', selectedDays.includes(day));
    btn.classList.toggle('btn-secondary', !selectedDays.includes(day));
  });
  document.querySelectorAll('.time-btn').forEach(btn => {
    const time = btn.dataset.time;
    btn.classList.toggle('btn-primary', selectedTimes.includes(time));
    btn.classList.toggle('btn-secondary', !selectedTimes.includes(time));
  });
  renderCustomTimes();
  updateNextRunTime(data.next_run);
  document.getElementById('schedule-enabled').checked = data.enabled || false;
  document.getElementById('schedule-settings').style.display = (data.enabled || false) ? 'block' : 'none';
  document.getElementById('schedule-dialog').classList.remove('hidden');
}

function closeScheduleDialog() {
  document.getElementById('schedule-dialog').classList.add('hidden');
}

function toggleSchedule() {
  const enabled = document.getElementById('schedule-enabled').checked;
  document.getElementById('schedule-settings').style.display = enabled ? 'block' : 'none';
}

function toggleDay(btn) {
  const day = parseInt(btn.dataset.day);
  const idx = selectedDays.indexOf(day);
  if (idx >= 0) { selectedDays.splice(idx, 1); btn.classList.remove('btn-primary'); btn.classList.add('btn-secondary'); }
  else { selectedDays.push(day); btn.classList.add('btn-primary'); btn.classList.remove('btn-secondary'); }
}

function toggleTime(btn) {
  const time = btn.dataset.time;
  const idx = selectedTimes.indexOf(time);
  if (idx >= 0) { selectedTimes.splice(idx, 1); btn.classList.remove('btn-primary'); btn.classList.add('btn-secondary'); }
  else { selectedTimes.push(time); btn.classList.add('btn-primary'); btn.classList.remove('btn-secondary'); }
}

function addCustomTime() {
  const input = document.getElementById('custom-time');
  const time = input.value;
  if (time && !selectedTimes.includes(time) && !customTimes.includes(time)) {
    customTimes.push(time);
    renderCustomTimes();
  }
  input.value = '';
}

function renderCustomTimes() {
  const container = document.getElementById('custom-times-list');
  container.innerHTML = customTimes.map(t => '<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:#dbeafe;color:#2563eb;border-radius:4px;font-size:12px;">' + t + '<button onclick="removeCustomTime('' + t + '')" style="background:none;border:none;cursor:pointer;color:#2563eb;font-size:14px;line-height:1;">&times;</button></span>').join('');
}

function removeCustomTime(time) {
  const idx = customTimes.indexOf(time);
  if (idx >= 0) customTimes.splice(idx, 1);
  renderCustomTimes();
}

function updateNextRunTime(timeStr) {
  const el = document.getElementById('next-run-time');
  if (timeStr) { el.textContent = new Date(timeStr).toLocaleString('zh-CN', {hour12: false}); }
  else { el.textContent = '--'; }
}

async function saveSchedule() {
  const enabled = document.getElementById('schedule-enabled').checked;
  const allTimes = [...selectedTimes, ...customTimes];
  const res = await fetch('/api/schedule/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled, days: selectedDays, times: allTimes})});
  const data = await res.json();
  if (data.ok) { closeScheduleDialog(); loadOverview(); }
}

</script>

<script>
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  event.target.classList.add('active');
  document.getElementById(name).classList.remove('hidden');
  if (name === 'channels') renderChannels();
  if (name === 'config') loadConfig();
  if (name === 'output') loadOutput();
}

async function runIPTV() {
  const res = await fetch('/api/run', {method: 'POST'});
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('progress-area').classList.remove('hidden');
  startLogRefresh();
  pollStatus();
}

  async function pollStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      const run = data.run;
      const phaseEl = document.getElementById('phase-text');
      const percentEl = document.getElementById('percent-text');
      const barEl = document.getElementById('progress-bar');
      if (phaseEl) phaseEl.textContent = run.phase || '解析源中...';
      if (percentEl) percentEl.textContent = run.progress + '%';
      if (barEl) barEl.style.width = run.progress + '%';
      if (run.status === 'done' || run.status === 'idle') {
        loadOverview();
        stopLogRefresh();
        return;
      }
      setTimeout(pollStatus, 2000);
    } catch(e) { console.error('pollStatus:', e); }
  }

async function loadOverview() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const chCount = document.getElementById('ch-count');
    const urlCount = document.getElementById('url-count');
    const fileCount = document.getElementById('file-count');
    const lastUpdate = document.getElementById('last-update');
    if (chCount) chCount.textContent = data.channels || 0;
    if (urlCount) urlCount.textContent = data.urls || 0;
    if (fileCount) fileCount.textContent = data.files;
    if (lastUpdate) lastUpdate.textContent = data.last_update || '--';
    const run = data.run;
    if (run.status === 'running') {
      document.getElementById('progress-area').classList.remove('hidden');
      const phaseEl = document.getElementById('phase-text');
      const percentEl = document.getElementById('percent-text');
      const barEl = document.getElementById('progress-bar');
      if (phaseEl) phaseEl.textContent = run.phase || '解析源中...';
      if (percentEl) percentEl.textContent = (run.progress || 0) + '%';
      if (barEl) barEl.style.width = (run.progress || 0) + '%';
      if (!run.from_log) {
        startLogRefresh();
        pollStatus();
      }
    }
  } catch(e) { console.error('loadOverview:', e); }
}

function renderChannels(filter='') {
  const container = document.getElementById('channel-list');
  container.innerHTML = '';
  CHANNEL_DATA.forEach(group => {
    const uniqueChs = [...new Set(group.channels.map(c => c.name))];
    const filtered = filter ? uniqueChs.filter(n => n.includes(filter)) : uniqueChs;
    if (filtered.length === 0 && !filter) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h3>' + group.name + ' <span class="badge badge-info">' + uniqueChs.length + ' 频道</span></h3>';
    const table = document.createElement('table');
    table.className = 'table';
    table.innerHTML = '<thead><tr><th>频道名</th><th>分辨率</th><th>速度</th><th>线路数</th></tr></thead>';
    const tbody = document.createElement('tbody');
    const channelMap = {};
    group.channels.forEach(ch => {
      if (!channelMap[ch.name]) channelMap[ch.name] = {resolution: ch.resolution, speed: ch.speed, count: 0};
      channelMap[ch.name].count++;
    });
    Object.entries(channelMap).forEach(([name, info]) => {
      if (filter && !name.includes(filter)) return;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + name + '</td><td><span class="badge badge-success">' + info.resolution + '</span></td><td>' + (info.speed || '-') + '</td><td>' + info.count + '</td>';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
    container.appendChild(card);
  });
}

function filterChannels(val) { renderChannels(val); }

async function loadConfig() {
  const res = await fetch('/api/config');
  const data = await res.json();
  document.getElementById('config-editor').value = data.content;
}

async function saveConfig() {
  const content = document.getElementById('config-editor').value;
  await fetch('/api/config/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content})});
  alert('配置已保存');
}

async function loadOutput() {
  const res = await fetch('/api/output');
  const data = await res.json();
  const tbody = document.getElementById('output-tbody');
  tbody.innerHTML = '';
  data.files.forEach(f => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + f.name + '</td><td>' + (f.size/1024).toFixed(1) + ' KB</td><td>' + new Date(f.mtime*1000).toLocaleString('zh-CN') + '</td><td><a href="/api/output/download/' + f.name + '" class="btn btn-secondary" style="padding:6px 12px;font-size:12px">下载</a></td>';
    tbody.appendChild(tr);
  });
}

let logRefreshInterval = null;
function startLogRefresh() {
  refreshLogs();
  logRefreshInterval = setInterval(refreshLogs, 5000);
}
function stopLogRefresh() {
  if (logRefreshInterval) { clearInterval(logRefreshInterval); logRefreshInterval = null; }
}
async function refreshLogs() {
  try {
    const res = await fetch('/api/logs?tail=100');
    const data = await res.json();
    const logEl = document.getElementById('log-preview');
    if (logEl) { logEl.textContent = data.lines.map(l => l.trim()).join('\n'); logEl.scrollTop = logEl.scrollHeight; }
  } catch(e) {}
}

loadOverview();
setInterval(loadOverview, 30000);



<!-- Schedule Dialog -->
<div id="schedule-dialog" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:16px;padding:32px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;">

      <button onclick="closeScheduleDialog()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#64748b;">&times;</button>
    </div>
    
    <div style="margin-bottom:20px;">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
        <input type="checkbox" id="schedule-enabled" onchange="toggleSchedule()">

      </label>
    </div>
    
    <div id="schedule-settings">

        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="day-btn btn-secondary" data-day="0" onclick="toggleDay(this)">周一</button>
          <button class="day-btn btn-secondary" data-day="1" onclick="toggleDay(this)">周二</button>
          <button class="day-btn btn-secondary" data-day="2" onclick="toggleDay(this)">周三</button>
          <button class="day-btn btn-secondary" data-day="3" onclick="toggleDay(this)">周四</button>
          <button class="day-btn btn-secondary" data-day="4" onclick="toggleDay(this)">周五</button>
          <button class="day-btn btn-secondary" data-day="5" onclick="toggleDay(this)">周六</button>
          <button class="day-btn btn-secondary" data-day="6" onclick="toggleDay(this)">周日</button>
        </div>
      </div>
      
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:14px;font-weight:500;margin-bottom:10px;">选择执行时间</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="time-btn btn-secondary" data-time="06:00" onclick="toggleTime(this)">06:00</button>
          <button class="time-btn btn-secondary" data-time="12:00" onclick="toggleTime(this)">12:00</button>
          <button class="time-btn btn-secondary" data-time="18:00" onclick="toggleTime(this)">18:00</button>
          <button class="time-btn btn-secondary" data-time="22:00" onclick="toggleTime(this)">22:00</button>
        </div>
      </div>
      
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:14px;font-weight:500;margin-bottom:10px;">自定义时间</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="time" id="custom-time" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;">
          <button class="btn btn-secondary" onclick="addCustomTime()" style="padding:8px 16px;">添加</button>
        </div>
        <div id="custom-times-list" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
      
      <div style="background:#f8fafc;padding:16px;border-radius:8px;margin-bottom:20px;">
        <div style="font-size:14px;color:#64748b;margin-bottom:8px;">下次执行时间</div>
        <div id="next-run-time" style="font-size:16px;font-weight:600;color:#2563eb;">--</div>
      </div>
      
      <div style="display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeScheduleDialog()">取消</button>
        <button class="btn btn-primary" onclick="saveSchedule()">保存</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
