name: Daily Update

on:
  schedule:
    # 北京时间 06:00 和 18:00（UTC 22:00 和 10:00）
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    branches:
      - main

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip deps
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache source & result data
      uses: actions/cache@v4
      with:
        path: cache/
        # 用日期做 key，同一天内两次运行共享同一份缓存
        key: iptv-cache-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          iptv-cache-${{ runner.os }}-${{ github.ref_name }}-

    - name: Install dependencies
      run: |
        sudo apt-get install -y ffmpeg
        pip install requests aiohttp

    - name: Run Python script
      run: python main.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        ls -la
        git status --porcelain
        git add -f output/*.m3u output/*.txt function.log
        echo "Staged files:"
        git diff --staged --name-only
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update live files"
          git push
        else
          echo "No changes to commit"
        fi

    env:
      TZ: Asia/Shanghai
