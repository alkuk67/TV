name: Docker Multi-arch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: yuanzl7712/iptv:latest
          cache-from: type=registry,ref=yuanzl7712/iptv:buildcache-armv7-clean
          # 全新缓存标签:强制 arm/v7 从零干净重建,不吃 amd64 层
          cache-to: type=registry,ref=yuanzl7712/iptv:buildcache-armv7-clean,mode=max
